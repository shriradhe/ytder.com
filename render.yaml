services:
  - type: web
    name: ytder-video-downloader
    env: python
    # Note: Remove 'plan' to use free tier, or set to 'free' if available
    # plan: free  # Free tier (may still require payment info for verification)
    buildCommand: bash build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HOST
        value: 0.0.0.0
      # Database: Use Render's PostgreSQL service and set DATABASE_URL
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: ytder-db
      #     property: connectionString
      # Add your custom environment variables here:
      # - key: MAX_CONCURRENT_DOWNLOADS
      #   value: 10
      # - key: CACHE_TTL_SECONDS
      #   value: 3600
      # - key: RATE_LIMIT_PER_MINUTE
      #   value: 30
    healthCheckPath: /api/health
    autoDeploy: true

