[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytder-python-backend"
version = "1.0.0"
description = "High-performance FastAPI backend for video metadata extraction and download"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Video Downloader Team"}
]
keywords = ["video", "downloader", "fastapi", "yt-dlp", "youtube", "instagram", "tiktok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "yt-dlp>=2024.12.13",
    "cachetools>=5.3.2",
    "aiofiles>=24.0.0",
    "sqlalchemy>=2.0.0",
    "passlib>=1.7.4",
    "argon2-cffi>=25.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
    "fastapi-mail>=1.4.1",
    "reportlab>=4.0.0",
    "babel>=2.14.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ytder-python-backend"
Documentation = "https://github.com/yourusername/ytder-python-backend#readme"
Repository = "https://github.com/yourusername/ytder-python-backend"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

